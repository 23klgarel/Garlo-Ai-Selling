<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Garlo AI Selling</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="wrap">
    <div class="glow"></div>

    <div class="brand">
      <div class="logo-mark">G</div>
      <h1 class="brand-name">Garlo AI Selling</h1>
      <p class="brand-tag">Amazon → Kleinanzeigen · eBay.de</p>
    </div>

    <button id="openDashboard" class="dashboard-btn" type="button">
      <span class="icon">☩</span>
      <span class="label">Open Dashboard</span>
      <span class="arrow">→</span>
    </button>

    <p class="hint">Alle Funktionen findest du im Dashboard.</p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
